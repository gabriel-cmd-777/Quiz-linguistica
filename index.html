    font-size:15px;
    line-height:1.4;

  .opzione:hover{background:#e4e1d8;}
  .box{

    width:16px;height:16px;
    border:1.5px solid var(--ink);

  .opzione.corretta .box{background:var(--right);border-color:var(--right);}
  .opzione.sbagliata .box{background:var(--wrong);border-color:var(--wrong);}
  .opzione.locked{cursor:default;}
  .opzione.locked:hover{background:none;}
  .esito{
    margin-top:18px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  .esito.right{color:var(--right);}
  .esito.wrong{color:var(--wrong);}
  .azioni{
    margin-top:26px;
    display:flex;
    justify-content:flex-end;
  }
  button.avanti{
    font-family:inherit;
    font-size:13px;
    letter-spacing:.04em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:10px 22px;
    cursor:pointer;
  }
  button.avanti:hover{opacity:.85;}
  .fine{
    text-align:center;
    padding-top:40px;
  }
  .fine .num{
    font-size:48px;
    font-weight:700;
    line-height:1;
  }

    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    padding:9px 20px;

    text-transform:uppercase;
    cursor:pointer;

</style>
</head>

let queue = DATA.map((d,i)=>i);
let total = DATA.length;
let answeredOk = 0;
let current = null;
let locked = false;

const app = document.getElementById('app');
const countEl = document.getElementById('count');

function next(){
  if(queue.length===0){ renderEnd(); return; }
  current = queue.shift();
  locked = false;
  render();
}

function render(){
  const [les,q,opts,correct] = DATA[current];
  countEl.textContent = "restano " + queue.length;
  const li = opts.map((o,i)=>
    `<li class="opzione" data-i="${i}"><span class="box"></span><span>${o}</span></li>`
  ).join('');
  app.innerHTML = `
    <div class="lezione">${les}</div>
    <p class="domanda">${q}</p>
    <ul class="opzioni">${li}</ul>
    <div class="esito" id="esito"></div>
    <div class="azioni"><button class="avanti" id="avanti" style="display:none">Avanti</button></div>
  `;
  app.querySelectorAll('.opzione').forEach(el=>{
    el.addEventListener('click', ()=>onPick(parseInt(el.dataset.i)));
  });
}

function onPick(i){
  if(locked) return;
  locked = true;
  const [,,opts,correct] = DATA[current];
  const els = app.querySelectorAll('.opzione');
  els.forEach(e=>e.classList.add('locked'));
  const esito = document.getElementById('esito');
  if(i===correct){
    els[i].classList.add('corretta');
    esito.textContent = "corretto";
    esito.className = "esito right";
    answeredOk++;
  } else {
    els[i].classList.add('sbagliata');
    els[correct].classList.add('corretta');
    esito.textContent = "sbagliato — risposta esatta evidenziata";
    esito.className = "esito wrong";
    queue.push(current);
  }
  document.getElementById('avanti').style.display = 'inline-block';
  document.getElementById('avanti').addEventListener('click', next);
}

function renderEnd(){
  countEl.textContent = "";
  app.innerHTML = `
    <div class="fine">
      <div class="num">${total}/${total}</div>
      <p>domande risposte correttamente</p>
      <button class="reset" id="reset">Ricomincia</button>
    </div>
  `;
  document.getElementById('reset').addEventListener('click', ()=>{
    queue = DATA.map((d,i)=>i);
    answeredOk = 0;
    next();
  });
}

next();
</script>
